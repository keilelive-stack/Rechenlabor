name: Restore CIQ original archives
on:
  push:
    branches:
      - copilot/rechenlabor
    paths:
      - .github/workflows/restore-originals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.ref == 'refs/heads/copilot/rechenlabor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify originals
        run: |
          python -m pip install gdown==5.2.0
          python restore_originals.py
          sha256sum -c SHA256SUMS.txt
      - name: Commit verified archives on Copilot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Quellen/CIQ_Rechen_Startpaket_2026-11-24_FULLCODE.zip Quellen/Operator_sortiert_nummeriert.zip
          if git diff --cached --quiet; then
            echo "Original archives already committed."
            exit 0
          fi
          git commit -m "Add checksum-verified original CIQ ZIP archives"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/copilot/rechenlabor
